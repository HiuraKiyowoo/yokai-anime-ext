name: build-ext
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Pustaka antarmuka sumber diambil dari repo aplikasi, dipatok ke satu
      # commit supaya build tidak berubah diam-diam saat aplikasi diperbarui.
      - name: Ambil pustaka API dari repo Yokai
        uses: actions/checkout@v4
        with:
          repository: HiuraKiyowoo/yokai
          ref: 87fadbc62a03e5d156c5fd8331f461737af27dff
          path: yokai

      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "build-tools;35.0.0"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setelan Gradle untuk CI
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.daemon=false\norg.gradle.jvmargs=-Xmx5120m\norg.gradle.workers.max=2\nkotlin.incremental=false\n' > ~/.gradle/gradle.properties

      # Keystore tetap: sidik jarinya harus sama dengan signingKeyFingerprint di
      # repo.json, kalau tidak aplikasi menolak mempercayai ekstensi otomatis.
      - name: Build semua ekstensi
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/yokai-ext.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          MODUL=$(python3 -c "import json;print(' '.join(':'+e['module']+':assembleRelease' for e in json.load(open('extensions.json'))))")
          echo "modul: $MODUL"
          ./gradlew $MODUL --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      # Bukti bahwa APK ditandatangani kunci yang benar, bukan keystore debug.
      - name: Periksa sidik jari APK
        if: success()
        run: |
          KS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          : > sidik.txt
          for APK in */build/outputs/apk/release/*.apk; do
            echo "== $APK" | tee -a sidik.txt
            "$KS/apksigner" verify --print-certs "$APK" | tee -a sidik.txt
          done

      - name: Ringkas galat
        if: always()
        run: |
          {
            echo "===== awal ====="; head -40 build.log 2>/dev/null
            echo "===== What went wrong ====="; grep -A 25 "What went wrong" build.log 2>/dev/null
            echo "===== error ====="; grep -nE "^e: |error:|Cannot|Unresolved|FAILURE|Could not" build.log 2>/dev/null | head -40
          } > err.txt 2>&1 || true

      - name: Unggah galat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: err
          path: |
            err.txt
            sidik.txt

      - name: Buat index.min.json
        if: success()
        run: python3 scripts/buat_index.py

      - name: Rilis APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while read -r M V; do
            TAG="v$V"
            gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$M $V" --notes "Ekstensi anime untuk Yokai."
            gh release upload "$TAG" "$M/build/outputs/apk/release/"*.apk --clobber
          done < <(python3 -c "import json;[print(e['module'], e['version']) for e in json.load(open('extensions.json'))]")

      # Aplikasi menyusun URL unduhan sendiri: <base>/apk/<nama apk>.
      # Jadi APK-nya harus benar-benar ada di folder apk/ dalam repo ini.
      - name: Simpan indeks + APK ke repo
        if: success()
        run: |
          mkdir -p apk
          for M in $(python3 -c "import json;[print(e['module']) for e in json.load(open('extensions.json'))]"); do
            cp "$M/build/outputs/apk/release/"*.apk "apk/$M-release.apk"
          done
          ls -lh apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.min.json apk
          git commit -m "chore: perbarui index.min.json + APK [skip ci]" || echo "tidak ada perubahan"
          git push

      - name: Unggah APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '*/build/outputs/apk/release/*.apk'
          if-no-files-found: warn
